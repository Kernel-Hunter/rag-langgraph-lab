# Eval set for the help desk. Run: rag-lab eval
# expect_any: the answer passes if it contains at least one of these strings (case-insensitive)
# expect_idk: the answer passes only if it says "I don't know"
# Update these when you swap data/handbook.md for the real handbook.pdf.

questions:
  - id: absences
    question: How many absences are allowed before I fail?
    expect_any: ["two", "2"]

  - id: late
    question: I was 20 minutes late twice. How many absences is that?
    expect_any: ["two", "2"]

  - id: final-exam
    question: When is the final exam?
    expect_any: ["week 13"]

  - id: grading
    question: How much is the final exam worth in the final grade?
    expect_any: ["40%", "40 %", "40 percent"]

  - id: course-length
    question: How many weeks does the course last?
    expect_any: ["12", "twelve"]

  - id: late-project
    question: What happens if we submit the mini-project two days late?
    expect_any: ["20%", "10%"]

  - id: dog
    question: Can I bring my dog?
    expect_idk: true

  - id: parking
    question: Where can I park my car on campus?
    expect_idk: true
