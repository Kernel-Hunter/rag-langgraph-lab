name: release

# Push a tag like v0.3.0 to build the Vesper desktop app for Windows, macOS
# and Linux and attach it to a GitHub release. "Run workflow" builds without
# releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The React UI builds into src/vesper/web, so it must exist before the
      # engine is frozen.
      - name: Build the web UI
        if: hashFiles('apps/web/package.json') != ''
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build

      - run: pip install -e . pyinstaller pillow
      - name: Build the engine
        run: python packaging/build_engine.py

      - run: npm --prefix apps/desktop ci
      - name: Package the app
        run: npm --prefix apps/desktop run dist

      - name: Smoke test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: '"apps/desktop/release/mac-arm64/Vesper.app/Contents/MacOS/Vesper" --smoke'
      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "apps\desktop\release\win-unpacked\Vesper.exe" -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a apps/desktop/release/linux-unpacked/vesper --smoke --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write checksums
        run: cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "Vesper ${{ github.ref_name }}" \
            --notes-file - <<'EOF'
          Vesper desktop app: chat with your documents using OpenAI, Claude, Gemini, DeepSeek, Mistral, Groq, OpenRouter, Ollama and other models.

          **Install with one command (no security warning):**

          macOS (Apple Silicon) and Linux (x86_64):
          ```
          curl -fsSL https://raw.githubusercontent.com/Kernel-Hunter/vesper/main/install.sh | bash
          ```

          Windows (PowerShell):
          ```
          irm https://raw.githubusercontent.com/Kernel-Hunter/vesper/main/install.ps1 | iex
          ```

          The files below are the same app for manual download. Browsers mark them as downloaded, so the first launch shows a warning (macOS: right-click the app, Open; Windows: More info, Run anyway).
          EOF
