name: release

# Push a tag like v0.2.0 to build the desktop app for Windows, macOS and Linux
# and attach it to a GitHub release. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller pillow
      - run: python packaging/build.py

      - name: Smoke test the packaged app with its window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RAG-Help-Desk\RAG-Help-Desk.exe" -ArgumentList "--smoke","--window" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
      - name: Smoke test the packaged app with its window (macOS)
        if: runner.os == 'macOS'
        run: dist/RAG-Help-Desk.app/Contents/MacOS/RAG-Help-Desk --smoke --window
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/RAG-Help-Desk/RAG-Help-Desk --smoke

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: macOS zip and disk image
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/RAG-Help-Desk.app dist/RAG-Help-Desk-macOS-arm64.zip
          hdiutil create -volname "RAG Help Desk" -srcfolder dist/RAG-Help-Desk.app -ov -format UDZO dist/RAG-Help-Desk-macOS-arm64.dmg
      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          cp packaging/icon.png dist/RAG-Help-Desk/icon.png
          tar -czf dist/RAG-Help-Desk-Linux-x86_64.tar.gz -C dist RAG-Help-Desk

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            dist/RAG-Help-Desk-Setup.exe
            dist/RAG-Help-Desk-macOS-arm64.zip
            dist/RAG-Help-Desk-macOS-arm64.dmg
            dist/RAG-Help-Desk-Linux-x86_64.tar.gz
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "RAG Help Desk ${{ github.ref_name }}" \
            --notes-file - <<'EOF'
          Desktop app for the Chapter 5B RAG lab: chat with your documents using OpenAI, Claude, Gemini, DeepSeek, Mistral, Groq, OpenRouter, Ollama and other models.

          **Install with one command (no security warning):**

          macOS (Apple Silicon) and Linux:
          ```
          curl -fsSL https://raw.githubusercontent.com/Kernel-Hunter/rag-langgraph-lab/main/install.sh | bash
          ```

          Windows (PowerShell):
          ```
          irm https://raw.githubusercontent.com/Kernel-Hunter/rag-langgraph-lab/main/install.ps1 | iex
          ```

          The files below are the same app for manual download. Browsers mark them as downloaded, so the first launch shows a warning (macOS: right-click the app, Open; Windows: More info, Run anyway).
          EOF
