name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,dictation]"
      - name: Tests (Linux runs the window test on a virtual display)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q -rs; else pytest -q -rs; fi
      - name: CLI entry points work
        run: |
          vesper --version
          vesper --help
      - name: Print mode answers offline with the fake model
        shell: bash
        env:
          VESPER_FAKE_LLM: "1"
          VESPER_HOME: ${{ runner.temp }}/vesper-home
        run: vesper -C . "hello" 

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - name: Built UI in src/vesper/web is up to date
        run: git status --porcelain src/vesper/web && test -z "$(git status --porcelain src/vesper/web)"

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run build

  # Runs the one-line installers the way users do. They install the latest release, so this
  # checks the scripts themselves on each OS, not the code in this commit.
  install:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          bash install.sh
          ~/.local/bin/vesper --version
      - name: install.ps1 (through iex, like the README)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:USERPROFILE\.local\bin\vesper.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'vesper did not run' }
