[project]
name = "vesper-agent"
version = "0.7.1"
description = "Vesper: an open source AI coding agent for your terminal and desktop. It reads, searches and edits files, runs commands with your approval, moves between projects, and saves every session in SQLite. Built on LangChain and LangGraph, works with 17 model providers or fully offline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastembed>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
chroma = ["langchain-chroma>=1.0"]
local = ["langchain-huggingface>=1.0", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vesper = "vesper.tui:main"
rag-lab = "vesper.cli:main"

[project.gui-scripts]
vesper-app = "vesper.desktop:main"

[project.urls]
Homepage = "https://github.com/Kernel-Hunter/vesper"
Issues = "https://github.com/Kernel-Hunter/vesper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vesper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
