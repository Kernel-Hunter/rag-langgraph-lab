[project]
name = "rag-langgraph-lab"
version = "0.3.0"
description = "Pagewise: chat with your documents (Chapter 5B RAG lab with LangChain and LangGraph), with many model providers and an eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastembed>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
chroma = ["langchain-chroma>=1.0"]
local = ["langchain-huggingface>=1.0", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[project.gui-scripts]
rag-lab-app = "rag_lab.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
